# fortification-gates.yml
#
# Place at: .github/workflows/fortification-gates.yml
#
# Placeholders to customize before this runs, marked with CUSTOMIZE:
#   - test/build commands (currently assume npm; swap for your stack)
#   - PLAN_DOC_PATH (path to the spec/plan doc Step 1 checks against)
#   - coverage threshold
# Requires repo secrets: ANTHROPIC_API_KEY, STRIX_API_KEY (or reuse ANTHROPIC_API_KEY
# if running Strix against the same provider — check current Strix docs)

name: Fortification Gates

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ---- Step 1: Plan Alignment ----
  plan-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Diff against base
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
      # CUSTOMIZE: PLAN_DOC_PATH — the spec/plan this PR should map to
      - name: Check alignment via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAN_DOC_PATH: docs/PLAN.md
        run: |
          python3 - <<'PY'
          import os, json, subprocess, urllib.request
          diff = open("/tmp/pr.diff").read()[:15000]
          plan = open(os.environ["PLAN_DOC_PATH"]).read()[:15000]
          prompt = (
            "You are the plan-alignment gate. Given the PLAN and the DIFF, "
            "answer PASS or FAIL on the first line, then one line why.\n"
            "Flag scope creep (built but not planned) and gaps (planned but not built).\n\n"
            f"PLAN:\n{plan}\n\nDIFF:\n{diff}"
          )
          req = urllib.request.Request(
            "https://api.anthropic.com/v1/messages",
            data=json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 300,
              "messages": [{"role": "user", "content": prompt}]
            }).encode(),
            headers={
              "Content-Type": "application/json",
              "x-api-key": os.environ["ANTHROPIC_API_KEY"],
              "anthropic-version": "2023-06-01"
            }
          )
          result = json.loads(urllib.request.urlopen(req).read())
          text = result["content"][0]["text"]
          print(text)
          if not text.strip().startswith("PASS"):
              raise SystemExit(1)
          PY

  # ---- Step 2: Unit Tests + coverage ----
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CUSTOMIZE: swap for your actual package manager / language
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm test -- --coverage
      # CUSTOMIZE: coverage threshold (currently 80, matching ECC's tdd-guide default)
      - name: Enforce coverage floor
        run: |
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Below 80% floor"; exit 1
          fi

  # ---- Step 3: Reasoning Trace (evidence-backed PR body) ----
  reasoning-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const hasEvidence = /## Evidence/i.test(body) && body.length > 200;
            if (!hasEvidence) {
              core.setFailed("PR body missing an '## Evidence' section with cited test output / diff lines / spec sections.");
            }

  # ---- Step 5: End-to-End Completeness ----
  e2e-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      # CUSTOMIZE: swap for your actual e2e command (Playwright assumed, matching ECC's e2e-runner)
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - name: Check for stub markers
        run: |
          if grep -rE "TODO|FIXME|throw new Error\(.unimplemented" --include=*.ts --include=*.tsx src/; then
            echo "Stub/placeholder markers found in touched paths"; exit 1
          fi

  # ---- Step 6: Adversarial Gate (Strix) ----
  adversarial-scan:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Install Strix
        run: pipx install strix-agent
      # CUSTOMIZE: verify current CLI flags against docs.strix.ai — this assumes
      # diff-scoped CI mode per Strix's documented ci-security-scanning-with-strix skill
      - name: Diff-scoped scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: strix scan --diff --base origin/${{ github.base_ref }} --output /tmp/strix-report.json
      - name: Fail on unresolved findings
        run: |
          FINDINGS=$(python3 -c "import json;print(len(json.load(open('/tmp/strix-report.json')).get('findings',[])))")
          echo "Findings: $FINDINGS"
          if [ "$FINDINGS" -gt 0 ]; then exit 1; fi
      # Heavier pass only on release-candidate tags — CUSTOMIZE the tag pattern
      - name: Full OWASP pass (release candidates only)
        if: startsWith(github.head_ref, 'release/')
        run: strix scan --workflow owasp-top-10-testing --output /tmp/strix-owasp.json

  # ---- Step 4: Attempt tracking + escalation (applies across all gates above) ----
  attempt-tracker:
    runs-on: ubuntu-latest
    needs: [plan-alignment, unit-tests, reasoning-trace, e2e-completeness, adversarial-scan]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const labels = (await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr
            })).data.map(l => l.name);

            const attemptLabels = labels.filter(l => l.startsWith("fortification-attempt-"));
            const attempt = attemptLabels.length
              ? Math.max(...attemptLabels.map(l => parseInt(l.split("-").pop()))) + 1
              : 1;

            const securityFailed = needs["adversarial-scan"].result === "failure";

            if (attempt >= 3) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Fortification gate failed 3x on PR #${pr}`,
                body: `PR #${pr} failed fortification gates 3 times. See CI run history for each attempt's logs.`,
                labels: securityFailed ? ["priority:security", "fortification-escalated"] : ["fortification-escalated"]
              });
              core.setFailed("3-attempt cap reached — escalated to GitHub Issue, PR halted.");
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
                labels: [`fortification-attempt-${attempt}`]
              });
            }
